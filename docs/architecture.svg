<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" font-family="system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="900" height="600" fill="#ffffff"/>
  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#f1f5f9" stroke-width="0.5"/>
    </pattern>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
    <marker id="arrow-gray" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10b981"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="900" height="600" fill="url(#grid)"/>

  <!-- Docker Compose background -->
  <rect x="90" y="210" width="720" height="360" rx="16" ry="16" fill="rgba(241,245,249,0.5)" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="790" y="232" font-size="11" fill="#94a3b8" text-anchor="end">docker-compose</text>

  <!-- apps/web block -->
  <rect x="60" y="60" width="180" height="80" rx="12" ry="12" fill="#ffffff" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
  <text x="150" y="88" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">apps/web</text>
  <text x="150" y="106" font-size="12" fill="#475569" text-anchor="middle">React 19 + Vite</text>
  <text x="150" y="122" font-size="11" fill="#94a3b8" text-anchor="middle">port 3000</text>

  <!-- Browser / Client block -->
  <rect x="360" y="60" width="180" height="80" rx="12" ry="12" fill="#ffffff" stroke="#475569" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="105" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Browser / Client</text>

  <!-- Identity Service block -->
  <rect x="120" y="240" width="200" height="100" rx="12" ry="12" fill="#ffffff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="220" y="272" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Identity Service</text>
  <text x="220" y="292" font-size="12" fill="#475569" text-anchor="middle">Node.js / Fastify</text>
  <text x="220" y="310" font-size="11" fill="#94a3b8" text-anchor="middle">port 3002</text>

  <!-- Ledger Service block -->
  <rect x="580" y="240" width="200" height="100" rx="12" ry="12" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <text x="680" y="272" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">Ledger Service</text>
  <text x="680" y="292" font-size="12" fill="#475569" text-anchor="middle">Node.js / Fastify</text>
  <text x="680" y="310" font-size="11" fill="#94a3b8" text-anchor="middle">port 3001</text>

  <!-- identity-db block -->
  <rect x="120" y="450" width="200" height="80" rx="12" ry="12" fill="#ffffff" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
  <text x="220" y="482" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">identity-db</text>
  <text x="220" y="502" font-size="12" fill="#475569" text-anchor="middle">PostgreSQL</text>

  <!-- ledger-db block -->
  <rect x="580" y="450" width="200" height="80" rx="12" ry="12" fill="#ffffff" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
  <text x="680" y="482" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">ledger-db</text>
  <text x="680" y="502" font-size="12" fill="#475569" text-anchor="middle">PostgreSQL</text>

  <!-- Arrow: apps/web → Browser/Client -->
  <line x1="240" y1="100" x2="358" y2="100" stroke="#475569" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <text x="299" y="93" font-size="10" fill="#475569" text-anchor="middle">serves</text>

  <!-- Arrow: Browser/Client → Identity Service -->
  <line x1="400" y1="140" x2="260" y2="238" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="310" y="180" font-size="10" fill="#3b82f6" text-anchor="middle">JWT (external)</text>

  <!-- Arrow: Browser/Client → Ledger Service -->
  <line x1="500" y1="140" x2="640" y2="238" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-emerald)"/>
  <text x="590" y="180" font-size="10" fill="#10b981" text-anchor="middle">JWT (external)</text>

  <!-- Arrow: Identity ↔ Ledger (bidirectional) -->
  <line x1="320" y1="285" x2="578" y2="285" stroke="#64748b" stroke-width="2" marker-start="url(#arrow-slate)" marker-end="url(#arrow-slate)"/>
  <text x="450" y="278" font-size="10" fill="#64748b" text-anchor="middle">JWT (internal)</text>

  <!-- Arrow: Identity → identity-db -->
  <line x1="220" y1="340" x2="220" y2="448" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-slate)"/>

  <!-- Arrow: Ledger → ledger-db -->
  <line x1="680" y1="340" x2="680" y2="448" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-slate)"/>
</svg>